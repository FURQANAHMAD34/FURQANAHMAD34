<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" fill="none" role="img" aria-label="Furqan Ahmad - Cyber Security Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#17b3a6" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="190" fill="url(#bg)"/>
  <rect width="900" height="190" fill="url(#grid)"/>

  <!-- vertical scan line sweeping down -->
  <rect x="0" width="900" height="2" fill="#00F5D4" opacity="0.18">
    <animate attributeName="y" values="-4;192;-4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="450" y="86" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace"
        font-size="46" font-weight="bold" fill="#00F5D4" filter="url(#glow)" letter-spacing="5">FURQAN AHMAD<tspan dx="4" fill="#39FF14">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
    <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>
  </text>

  <!-- animated underline sweep -->
  <rect x="230" y="100" width="440" height="3" fill="url(#sweep)">
    <animate attributeName="x" values="230;670;230" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="450" y="130" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace"
        font-size="15" fill="#8b949e" letter-spacing="2">&gt; Cyber Security Analyst &#183; Offensive Security &#183; Reverse Engineering &#183; Malware Analysis</text>

  <!-- terminal prompt -->
  <text x="450" y="162" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace"
        font-size="13" fill="#17b3a6">&#9484;&#9472;&#9472;( furqan&#12665;offsec )&#9472;[ ~/red-team ]  &#9492;&#9472;$ ./recon --target scope --verify
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
